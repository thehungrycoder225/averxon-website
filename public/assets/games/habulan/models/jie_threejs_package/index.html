<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jie — Three.js 3D Blockout</title><style>*{box-sizing:border-box}body{margin:0;background:#11131d;color:#f5f5fc;font:14px system-ui}canvas{display:block}.panel{position:absolute;top:20px;left:20px;background:#161927db;padding:16px 20px;border:1px solid #35394b;border-radius:12px;max-width:340px}.panel strong{font-size:19px}.small{color:#b9bdca;line-height:1.5}.tag{color:#59dddd}button{background:#292e45;color:white;border:1px solid #4a5264;border-radius:8px;padding:7px 12px;cursor:pointer;margin:4px 4px 0 0}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><div class="panel"><strong>JIE</strong> <span class="tag">/ Three.js blockout</span><p class="small">Procedural stylized 3D approximation based on the supplied reference; not a precise reconstructed mesh or rigged production character.</p><button id="front">Front</button><button id="side">Side</button><button id="back">Back</button><button id="spin">Auto-rotate: off</button><p class="small">Drag to orbit • Scroll to zoom</p><div id="status">Loading model…</div></div><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const scene=new THREE.Scene();scene.background=new THREE.Color('#11131d');const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(3.3,2.2,5.5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdde8ff,0x38354d,3));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(3,7,5);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.2,0);controls.enableDamping=true;controls.update();new GLTFLoader().load('./jie.glb',g=>{scene.add(g.scene);document.querySelector('#status').textContent='GLB loaded • '+g.scene.children.length+' objects'},undefined,e=>document.querySelector('#status').textContent='Loading failed: run via a local HTTP server');document.querySelector('#front').onclick=()=>{camera.position.set(0,1.8,5);controls.update()};document.querySelector('#side').onclick=()=>{camera.position.set(5,1.8,0);controls.update()};document.querySelector('#back').onclick=()=>{camera.position.set(0,1.8,-5);controls.update()};document.querySelector('#spin').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.target.textContent='Auto-rotate: '+(controls.autoRotate?'on':'off')};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function tick(){requestAnimationFrame(tick);controls.update();renderer.render(scene,camera)}tick();</script></body></html>
